<script>
  window.__tweaks = { accent: '#6fd614', hero: 'dark', radius: 8 };
  function applyTweak(key, val) {
    window.__tweaks[key] = val;
    if (key === 'accent') document.documentElement.style.setProperty('--green', val);
    if (key === 'radius') document.documentElement.style.setProperty('--radius', val + 'px');
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
    if (window.__tweakRefresh) window.__tweakRefresh();
  }
  window.addEventListener('message', e => {
    if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks-panel').classList.add('visible');
    if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('visible');
  });
  window.parent.postMessage({ type: '__edit_mode_available' }, '*');

  (function(){
    const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1a2f10"/><stop offset="55%" stop-color="#2a4818"/><stop offset="100%" stop-color="#0f1f08"/></linearGradient>' +
      '<pattern id="p" x="0" y="0" width="80" height="40" patternUnits="userSpaceOnUse"><rect width="80" height="40" fill="url(#g)"/><path d="M0 20 Q20 10 40 20 T80 20" stroke="#3a6520" stroke-width="0.8" fill="none" opacity="0.4"/><path d="M0 30 Q20 22 40 30 T80 30" stroke="#4f8a28" stroke-width="0.6" fill="none" opacity="0.35"/></pattern></defs>' +
      '<rect width="1200" height="800" fill="url(#p)"/><rect width="1200" height="800" fill="url(#g)" opacity="0.5"/>' +
      '<g opacity="0.08" fill="#6fd614"><rect x="0" y="120" width="1200" height="40"/><rect x="0" y="280" width="1200" height="40"/><rect x="0" y="440" width="1200" height="40"/><rect x="0" y="600" width="1200" height="40"/></g>' +
      '<text x="600" y="420" font-family="sans-serif" font-size="32" font-weight="800" fill="#6fd614" text-anchor="middle" opacity="0.18" letter-spacing="8">GAMS</text></svg>'
    );
    document.addEventListener('error', function(e){
      const t = e.target;
      if (t && t.tagName === 'IMG' && t.src !== PLACEHOLDER && !t.dataset.fallback) {
        t.dataset.fallback = '1';
        t.src = PLACEHOLDER;
      }
    }, true);
    const style = document.createElement('style');
    style.textContent = 'img[data-fallback]{background:#1a2f10}';
    document.head.appendChild(style);
  })();
</script>

/* ── Scroll reveal wrapper ── */
function SR({ children, delay = 0, dir = 'up', style, ...rest }) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setVis(true); obs.disconnect(); } },
      { threshold: 0.08 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  const offsets = { up: 'translateY(28px)', left: 'translateX(-28px)', right: 'translateX(28px)' };
  return (
    <div ref={ref} style={{
      opacity: vis ? 1 : 0,
      transform: vis ? 'none' : (offsets[dir] || offsets.up),
      transition: `opacity 0.65s ${delay}s ease, transform 0.65s ${delay}s ease`,
      ...style,
    }} {...rest}>{children}</div>
  );
}

/* ── Animated counter hook ── */
function useCounter(str, active, dur = 1600) {
  const num = parseInt(str, 10);
  const [v, setV] = useState(0);
  useEffect(() => {
    if (!active || isNaN(num)) return;
    const t0 = performance.now();
    const tick = now => {
      const p = Math.min((now - t0) / dur, 1);
      setV(Math.round((1 - Math.pow(1 - p, 3)) * num));
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }, [active, num, dur]);
  return isNaN(num) ? null : v;
}

/* ── Testimonials ── */
function Testimonials() {
  const [active, setActive] = useState(0);
  const [paused, setPaused] = useState(false);
  const ref = useRef(null);
  const [sectionVis, setSectionVis] = useState(false);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) setSectionVis(true); }, { threshold: 0.1 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  useEffect(() => {
    if (!sectionVis || paused) return;
    const t = setInterval(() => setActive(a => (a + 1) % testimonials.length), 5500);
    return () => clearInterval(t);
  }, [sectionVis, paused]);

  const t = testimonials[active];

  return (
    <section style={{ background: '#111', padding: '100px 60px', borderTop: '1px solid #1a1a1a' }}>
      <div style={{ maxWidth: '900px', margin: '0 auto' }} ref={ref}>
        <SR style={{ marginBottom: '56px' }}>
          <span style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: '13px', letterSpacing: '3px', color: GREEN, textTransform: 'uppercase' }}>What Customers Say</span>
          <h2 style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 900, fontSize: 'clamp(36px, 5vw, 60px)', textTransform: 'uppercase', marginTop: '8px', lineHeight: 1 }}>Trusted by the<br /><span style={{ color: GREEN }}>Sunshine Coast</span></h2>
        </SR>

        <div onMouseEnter={() => setPaused(true)} onMouseLeave={() => setPaused(false)}>
          <div key={active} style={{ animation: 'fadeUp 0.5s ease both', background: '#141414', borderLeft: `3px solid ${GREEN}`, borderRadius: '0 8px 8px 0', padding: '40px 44px' }}>
            <div style={{ marginBottom: '20px', display: 'flex', gap: '3px' }}>
              {Array.from({ length: t.rating }).map((_, i) => (
                <span key={i} style={{ color: GREEN, fontSize: '18px' }}>★</span>
              ))}
            </div>
            <p style={{ fontSize: '17px', color: '#ccc', lineHeight: 1.75, marginBottom: '28px', fontStyle: 'italic', fontWeight: 300 }}>"{t.text}"</p>
            <div style={{ display: 'flex', alignItems: 'center', gap: '16px' }}>
              <div style={{ width: '44px', height: '44px', background: 'rgba(111,214,20,0.12)', border: `1px solid ${GREEN}`, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 800, fontSize: '18px', color: GREEN, flexShrink: 0 }}>
                {t.name.charAt(0)}
              </div>
              <div>
                <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: '17px', textTransform: 'uppercase', letterSpacing: '0.5px', color: '#f2f2f0' }}>{t.name}</div>
                <div style={{ fontSize: '13px', color: '#666', marginTop: '2px' }}>{t.suburb} · <span style={{ color: GREEN }}>{t.service}</span></div>
              </div>
            </div>
          </div>

          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginTop: '28px' }}>
            <div style={{ display: 'flex', gap: '8px' }}>
              {testimonials.map((_, i) => (
                <button key={i} className={`t-dot${i === active ? ' on' : ''}`} onClick={() => setActive(i)} aria-label={`Testimonial ${i + 1}`} />
              ))}
            </div>
            <div style={{ display: 'flex', gap: '8px' }}>
              <button onClick={() => setActive(a => (a - 1 + testimonials.length) % testimonials.length)} style={{ width: '36px', height: '36px', background: '#1a1a1a', border: '1px solid #2a2a2a', color: '#888', borderRadius: '50%', cursor: 'pointer', fontSize: '14px', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.2s' }}

                onMouseLeave={e => { e.currentTarget.style.borderColor = '#2a2a2a'; e.currentTarget.style.color = '#888'; }}
              >←</button>
              <button onClick={() => setActive(a => (a + 1) % testimonials.length)} style={{ width: '36px', height: '36px', background: '#1a1a1a', border: '1px solid #2a2a2a', color: '#888', borderRadius: '50%', cursor: 'pointer', fontSize: '14px', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.2s' }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = GREEN; e.currentTarget.style.color = GREEN; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = '#2a2a2a'; e.currentTarget.style.color = '#888'; }}
              >→</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

/* ── Quote Modal ── */
function QuoteModal({ onClose, preService }) {
  const [step, setStep] = useState(0);
  const [errors, setErrors] = useState({});
  const [form, setForm] = useState({
    services: preService ? [preService] : [],
    propertyType: '', size: '', frequency: '', address: '', notes: '',
    name: '', phone: '', email: '', preferredContact: 'phone',
  });

  useEffect(() => {
    const handler = e => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handler);
    return () => document.removeEventListener('keydown', handler);
  }, []);

  const update = (k, v) => setForm(p => ({ ...p, [k]: v }));
  const toggleService = (id) => {
    setForm(p => ({ ...p, services: p.services.includes(id) ? p.services.filter(x => x !== id) : [...p.services, id] }));
    setErrors(e => ({ ...e, services: undefined }));
  };

  const validate = (s) => {
    const errs = {};
    if (s === 0 && form.services.length === 0) errs.services = 'Please select at least one service to continue.';
    if (s === 2) {
      if (!form.name.trim()) errs.name = 'Please enter your full name.';
      if (!form.phone.trim() && !form.email.trim()) errs.contact = 'Please provide at least a phone number or email address.';
    }
    setErrors(errs);
    return Object.keys(errs).length === 0;
  };

  const FORM_ENDPOINT = 'https://formsubmit.co/ajax/gardenandmowingservices@gmail.com';
  const handleSubmit = async () => {
    if (!validate(2)) return;
    const lead = {
      name: form.name, phone: form.phone, email: form.email, address: form.address,
      services: form.services.map(id => services.find(s => s.id === id)?.title).join(', '),
      propertyType: form.propertyType, size: form.size, frequency: form.frequency, notes: form.notes,
      preferredContact: form.preferredContact, submittedAt: new Date().toISOString(), source: 'website_quote_form',
    };
    try {
      await fetch(FORM_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ ...lead, _subject: 'New GAMS quote from ' + form.name, _captcha: 'false' }),
      });
    } catch (e) { console.error('Form submission error:', e); }
    setStep(3);
  };

  const handleNext = () => {
    if (!validate(step)) return;
    if (step < 2) setStep(s => s + 1);
    else handleSubmit();
  };

  const inputStyle = { width: '100%', background: '#1a1a1a', border: '1px solid #2a2a2a', borderRadius: '6px', padding: '12px 16px', color: '#f2f2f0', fontSize: '15px', fontFamily: "'Barlow', sans-serif", outline: 'none', transition: 'border-color 0.2s' };
  const labelStyle = { display: 'block', fontFamily: "'Barlow Condensed', sans-serif", fontSize: '13px', letterSpacing: '1px', color: '#888', textTransform: 'uppercase', marginBottom: '8px' };
  const chipStyle = (sel) => ({
    padding: '12px', textAlign: 'center', borderRadius: '6px', cursor: 'pointer',
    border: sel ? `2px solid ${GREEN}` : '2px solid #252525',
    background: sel ? 'rgba(111,214,20,0.08)' : '#1a1a1a',
    fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 600, fontSize: '14px', textTransform: 'uppercase',
    color: sel ? GREEN : '#888', transition: 'all 0.2s',
  });

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 2000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '20px' }}
      onClick={e => e.target === e.currentTarget && onClose()}>
      <div style={{ position: 'absolute', inset: 0, background: 'rgba(0,0,0,0.85)', backdropFilter: 'blur(6px)' }} onClick={onClose} />
      <div style={{ position: 'relative', background: '#141414', border: '1px solid #252525', borderRadius: '12px', width: '100%', maxWidth: '560px', overflow: 'hidden', maxHeight: '90vh', display: 'flex', flexDirection: 'column' }}>
        <div style={{ background: '#0d0d0d', padding: '28px 32px', display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderBottom: '1px solid #1e1e1e' }}>
          <div>
            <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 900, fontSize: '24px', textTransform: 'uppercase', letterSpacing: '1px' }}>
              {step < 3 ? 'Get a Free Quote' : 'Quote Requested!'}
            </div>
            {step < 3 && <div style={{ color: '#666', fontSize: '13px', marginTop: '4px' }}>Step {step + 1} of 3 — {quoteSteps[step].title}</div>}
          </div>
          <button onClick={onClose} style={{ background: 'none', border: 'none', color: '#666', fontSize: '22px', cursor: 'pointer', lineHeight: 1 }}>✕</button>
        </div>
        {step < 3 && (
          <div style={{ height: '3px', background: '#1a1a1a' }}>
            <div style={{ height: '100%', background: GREEN, width: `${((step + 1) / 3) * 100}%`, transition: 'width 0.4s ease' }} />
          </div>
        )}
        <div style={{ padding: '32px', overflowY: 'auto', flex: 1 }}>
          {step === 0 && (
            <div>
              <p style={{ color: '#888', marginBottom: '24px', fontSize: '15px' }}>Select all that apply:</p>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '10px' }}>
                {services.map(s => {
                  const sel = form.services.includes(s.id);
                  return (
                    <div key={s.id} onClick={() => toggleService(s.id)} style={{
                      padding: '16px', borderRadius: '8px', cursor: 'pointer',
                      border: sel ? `2px solid ${GREEN}` : '2px solid #252525',
                      background: sel ? 'rgba(111,214,20,0.08)' : '#1a1a1a',
                      transition: 'all 0.2s',
                    }}>
                      <div style={{ fontSize: '22px', marginBottom: '6px' }}>{s.icon}</div>
                      <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, fontSize: '15px', color: sel ? GREEN : '#f2f2f0', textTransform: 'uppercase', transition: 'color 0.2s' }}>{s.title}</div>
                    </div>
                  );
                })}
              </div>
              {errors.services && <div className="form-error">⚠ {errors.services}</div>}
            </div>
          )}
          {step === 1 && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
              <div>
                <label style={labelStyle}>Property Type</label>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px' }}>
                  {['Residential', 'Acreage', 'Commercial'].map(t => (
                    <div key={t} onClick={() => update('propertyType', t)} style={chipStyle(form.propertyType === t)}>{t}</div>
                  ))}
                </div>
              </div>
              <div>
                <label style={labelStyle}>Approximate Block Size</label>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                  {['Small (< 400m²)', 'Medium (400–800m²)', 'Large (800m²–1 acre)', 'Acreage (1+ acres)'].map(t => (
                    <div key={t} onClick={() => update('size', t)} style={chipStyle(form.size === t)}>{t}</div>
                  ))}
                </div>
              </div>
              <div>
                <label style={labelStyle}>How often?</label>
                <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '8px' }}>
                  {['Once', 'Fortnightly', 'Monthly', 'Unsure'].map(t => (
                    <div key={t} onClick={() => update('frequency', t)} style={chipStyle(form.frequency === t)}>{t}</div>
                  ))}
                </div>
              </div>
              <div>
                <label style={labelStyle}>Property Address</label>
                <input style={inputStyle} placeholder="Street address or suburb" value={form.address} onChange={e => update('address', e.target.value)}
                  onFocus={e => e.target.style.borderColor = GREEN}
                  onBlur={e => e.target.style.borderColor = '#2a2a2a'} />
              </div>
              <div>
                <label style={labelStyle}>Additional Notes (optional)</label>
                <textarea style={{ ...inputStyle, resize: 'vertical', minHeight: '80px' }} placeholder="Anything else we should know?" value={form.notes} onChange={e => update('notes', e.target.value)}
                  onFocus={e => e.target.style.borderColor = GREEN}
                  onBlur={e => e.target.style.borderColor = '#2a2a2a'} />
              </div>
            </div>
          )}
          {step === 2 && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: '20px' }}>
              <div>
                <label style={labelStyle}>Full Name *</label>
                <input style={{ ...inputStyle, borderColor: errors.name ? '#ff5a5a' : '#2a2a2a' }} placeholder="John Smith" value={form.name}
                  onChange={e => { update('name', e.target.value); setErrors(er => ({ ...er, name: undefined })); }}
                  onFocus={e => e.target.style.borderColor = errors.name ? '#ff5a5a' : GREEN}
                  onBlur={e => e.target.style.borderColor = errors.name ? '#ff5a5a' : '#2a2a2a'} />
                {errors.name && <div className="form-error">⚠ {errors.name}</div>}
              </div>
              <div>
                <label style={labelStyle}>Phone Number</label>
                <input style={{ ...inputStyle, borderColor: errors.contact ? '#ff5a5a' : '#2a2a2a' }} placeholder="04XX XXX XXX" value={form.phone}
                  onChange={e => { update('phone', e.target.value); setErrors(er => ({ ...er, contact: undefined })); }}
                  onFocus={e => e.target.style.borderColor = GREEN}
                  onBlur={e => e.target.style.borderColor = '#2a2a2a'} />
              </div>
              <div>
                <label style={labelStyle}>Email Address</label>
                <input style={{ ...inputStyle, borderColor: errors.contact ? '#ff5a5a' : '#2a2a2a' }} placeholder="you@example.com" value={form.email}
                  onChange={e => { update('email', e.target.value); setErrors(er => ({ ...er, contact: undefined })); }}
                  onFocus={e => e.target.style.borderColor = GREEN}
                  onBlur={e => e.target.style.borderColor = '#2a2a2a'} />
                {errors.contact && <div className="form-error">⚠ {errors.contact}</div>}
              </div>
              <div>
                <label style={labelStyle}>Preferred Contact Method</label>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px' }}>
                  {['phone', 'sms', 'email'].map(t => (
                    <div key={t} onClick={() => update('preferredContact', t)} style={chipStyle(form.preferredContact === t)}>{t}</div>
                  ))}
                </div>
              </div>
              <div style={{ background: 'rgba(111,214,20,0.06)', border: '1px solid rgba(111,214,20,0.15)', borderRadius: '8px', padding: '16px' }}>
                <div style={{ fontFamily: "'Barlow Condensed', sans-serif", fontSize: '13px', color: GREEN, textTransform: 'uppercase', letterSpacing: '1px', marginBottom: '8px' }}>Your Quote Summary</div>
                <div style={{ fontSize: '14px', color: '#888', lineHeight: 1.7 }}>
                  <div><b style={{ color: '#ccc' }}>Services:</b> {form.services.map(id => services.find(s => s.id === id)?.title).join(', ') || '—'}</div>
                  <div><b style={{ color: '#ccc' }}>Property:</b> {form.propertyType || '—'} · {form.size || '—'}</div>
                  <div><b style={{ color: '#ccc' }}>Frequency:</b> {form.frequency || '—'}</div>
                  <div><b style={{ color: '#ccc' }}>Address:</b> {form.address || '—'}</div>
                </div>
              </div>
            </div>
          )}
          {step === 3 && (
            <div style={{ textAlign: 'center', padding: '20px 0' }}>
              <div style={{ fontSize: '64px', marginBottom: '20px' }}>✅</div>
              <h3 style={{ fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 900, fontSize: '32px', textTransform: 'uppercase', color: GREEN, marginBottom: '12px' }}>You're on the list!</h3>
              <p style={{ color: '#888', fontSize: '16px', lineHeight: 1.7, marginBottom: '24px' }}>
                Thanks {form.name.split(' ')[0] || 'there'}! We've received your quote request and will be in touch within 24 hours via {form.preferredContact}.
              </p>
              <p style={{ color: '#555', fontSize: '14px' }}>In the meantime, call us directly on <a href="tel:0422633941" style={{ color: GREEN, textDecoration: 'none' }}>0422 633 941</a></p>
              <div style={{ marginTop: '24px', padding: '16px', background: 'rgba(111,214,20,0.06)', border: '1px solid rgba(111,214,20,0.15)', borderRadius: '8px' }}>
                <p style={{ color: '#666', fontSize: '13px', marginBottom: '8px' }}>Follow us for lawn tips and before/afters:</p>
                <a href="https://www.instagram.com/gardenandmowingservices/" target="_blank" rel="noopener noreferrer" style={{ color: GREEN, fontSize: '14px', fontFamily: "'Barlow Condensed', sans-serif", fontWeight: 700, letterSpacing: '1px', textDecoration: 'none', textTransform: 'uppercase' }}>@gardenandmowingservices →</a>
              </div>
              <button onClick={onClose} style={{
                marginTop: '24px', background: GREEN, color: '#0d0d0d', border: 'none',
                padding: '14px 40px', borderRadius: '6px', fontFamily: "'Barlow Condensed', sans-serif",
                fontWeight: 800, fontSize: '16px', textTransform: 'uppercase', letterSpacing: '1px', cursor: 'pointer',
              }}>Close</button>
            </div>
          )}
        </div>
        {step < 3 && (
          <div style={{ padding: '20px 32px', background: '#0d0d0d', borderTop: '1px solid #1e1e1e', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>

              onMouseEnter={e => { e.currentTarget.style.borderColor = '#555'; e.currentTarget.style.color = '#ccc'; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = '#2a2a2a'; e.currentTarget.style.color = '#888'; }}
            >
              {step === 0 ? 'Cancel' : 'Back'}
            </button>
            <button onClick={handleNext} style={{
              background: GREEN, color: '#0d0d0d', border: 'none',
              padding: '12px 36px', borderRadius: '6px', fontFamily: "'Barlow Condensed', sans-serif",

            }}
              onMouseEnter={e => { e.currentTarget.style.background = '#7fff1a'; }}
              onMouseLeave={e => { e.currentTarget.style.background = GREEN; }}
            >
              {step < 2 ? 'Next →' : 'Submit Quote Request'}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

      <Footer />
      <MobileCTA onQuote={() => openQuote()} />
      {quoteOpen && <QuoteModal onClose={() => setQuoteOpen(false)} preService={preService} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
